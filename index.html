<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARRAGEN">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ARRAGEN Gestión Ganadera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>

/* Layout: banda verde de marca arriba, tablero en grilla que colapsa a una columna; en celular barra inferior con botón central de carga */
:root{
  --bg:#eef1ea; --surface:#ffffff; --surface-2:#e4e9de; --ink:#18261c; --muted:#5a695d; --line:#d3dbcc;
  --head:#173d29; --head-ink:#eef3ea; --head-muted:#a9c2b0;
  --pasto:#1f5a3a; --pasto-soft:#d7e8dc; --trigo:#b07d1e; --trigo-soft:#f5e9c9; --cuero:#8a5632; --cuero-soft:#efe0d3;
  --ok:#2c7a47; --ok-bg:#dff0e3; --warn:#9a6410; --warn-bg:#f7eacb; --crit:#ad2a1f; --crit-bg:#f8dfdb; --info:#2d5b77; --info-bg:#dde9f0;
  --shadow:0 1px 2px rgba(24,38,28,.06),0 4px 14px rgba(24,38,28,.05);
  --f-display:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Barlow Semi Condensed","Barlow",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1511; --surface:#172019; --surface-2:#202b23; --ink:#e6ece5; --muted:#9aa89d; --line:#2b382f;
  --head:#0c2217; --head-ink:#e6efe7; --head-muted:#89a592;
  --pasto:#74c08f; --pasto-soft:#1f3a29; --trigo:#d9ab4f; --trigo-soft:#3a2f17; --cuero:#cf9a6f; --cuero-soft:#3a2819;
  --ok:#7fcf98; --ok-bg:#1d3625; --warn:#e2b45a; --warn-bg:#3a2e14; --crit:#f08a7e; --crit-bg:#3d1c19; --info:#8cc0de; --info-bg:#1a2f3b;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#172019; --surface-2:#202b23; --ink:#e6ece5; --muted:#9aa89d; --line:#2b382f;
  --head:#0c2217; --head-ink:#e6efe7; --head-muted:#89a592;
  --pasto:#74c08f; --pasto-soft:#1f3a29; --trigo:#d9ab4f; --trigo-soft:#3a2f17; --cuero:#cf9a6f; --cuero-soft:#3a2819;
  --ok:#7fcf98; --ok-bg:#1d3625; --warn:#e2b45a; --warn-bg:#3a2e14; --crit:#f08a7e; --crit-bg:#3d1c19; --info:#8cc0de; --info-bg:#1a2f3b;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--trigo);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* Header */
.top{background:var(--head);color:var(--head-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-size:24px;letter-spacing:.08em;font-weight:700;line-height:1}
.brand small{display:block;font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--head-muted);margin-top:3px}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{background:none;border:0;color:var(--head-muted);padding:8px 14px;border-radius:8px;font-weight:600;font-size:15px}
.tab[aria-current="true"]{background:rgba(255,255,255,.1);color:var(--head-ink)}
.tab:hover{color:var(--head-ink)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.sel-est{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--head-ink);border-radius:8px;padding:8px 10px;max-width:190px}
.sel-est option{color:#18261c;background:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-prim{background:var(--trigo);border-color:var(--trigo);color:#1c1405}
.btn-prim:hover{filter:brightness(1.06);border-color:var(--trigo)}
.btn-green{background:var(--pasto);border-color:var(--pasto);color:var(--surface)}
.btn-danger{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}

/* Page */
main{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 110px}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.demo{background:var(--trigo-soft);color:var(--ink)}
.banner.ej{background:var(--info-bg)}
.h-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.h-row h1{font-family:var(--f-display);font-size:30px;font-weight:700;margin:0;line-height:1.1;text-wrap:balance}
.h-row p{margin:2px 0 0;color:var(--muted)}
.h-row .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.yearsel{display:flex;background:var(--surface-2);border-radius:9px;padding:3px}
.yearsel button{border:0;background:none;padding:6px 12px;border-radius:7px;font-family:var(--f-data);font-weight:600;color:var(--muted)}
.yearsel button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0;border-top:3px solid var(--line)}
.kpi.k-ing{border-top-color:var(--pasto)} .kpi.k-cob{border-top-color:var(--ok)} .kpi.k-pen{border-top-color:var(--trigo)} .kpi.k-egr{border-top-color:var(--cuero)}
.kpi .l{font-family:var(--f-data);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;line-height:1.15;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.kpi .s .bad{color:var(--crit);font-weight:600}
.kpi .s .good{color:var(--ok);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.c-8{grid-column:span 8}.c-4{grid-column:span 4}.c-6{grid-column:span 6}.c-12{grid-column:span 12}.c-5{grid-column:span 5}.c-7{grid-column:span 7}
.card h2{font-family:var(--f-display);font-size:19px;margin:0 0 2px;font-weight:600}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.card-h{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.card-h > div:first-child{min-width:0;flex:1}

/* Insights */
.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.in{border-radius:9px;padding:11px 12px 11px 14px;background:var(--surface-2);position:relative;min-width:0}
.in::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--muted)}
.in.crit{background:var(--crit-bg)} .in.crit::before{background:var(--crit)}
.in.warn{background:var(--warn-bg)} .in.warn::before{background:var(--warn)}
.in.ok{background:var(--ok-bg)} .in.ok::before{background:var(--ok)}
.in.info{background:var(--info-bg)} .in.info::before{background:var(--info)}
.in b{display:block;font-size:15px;line-height:1.3}
.in span{display:block;font-size:13.5px;color:var(--ink);opacity:.85;margin-top:3px}

/* Monthly chart */
.mchart{position:relative;height:230px;margin-top:6px;padding-left:46px}
.mc-grid{position:absolute;inset:0 0 24px 46px}
.mc-grid div{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.mc-grid span{position:absolute;right:100%;margin-right:6px;transform:translateY(-50%);font-family:var(--f-data);font-size:11px;color:var(--muted);white-space:nowrap}
.mc-cols{position:absolute;inset:0 0 0 46px;display:grid;grid-template-columns:repeat(12,1fr)}
.mc-col{display:flex;flex-direction:column;align-items:center;border:0;background:none;padding:0;border-radius:6px;min-width:0}
.mc-col:hover .mc-bars{box-shadow:inset 0 0 0 1px var(--line)}
.mc-col[aria-pressed="true"] .mc-bars{box-shadow:inset 0 0 0 1.5px var(--trigo)}
.mc-bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:5px 5px 0 0;padding-inline:2px}
.mc-bars i{display:block;width:44%;max-width:22px;border-radius:3px 3px 0 0;min-height:0}
.mc-bars i.ing{background:var(--pasto)}
.mc-bars i.proj{background:repeating-linear-gradient(135deg,var(--pasto-soft) 0 4px,transparent 4px 7px);border:1.5px dashed var(--pasto);border-bottom:0}
.mc-bars i.egr{background:var(--cuero);width:26%}
.mc-lbl{height:24px;line-height:24px;font-family:var(--f-data);font-size:12px;color:var(--muted)}
.mc-col[aria-pressed="true"] .mc-lbl{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mdetail{margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:14px;display:flex;gap:6px 16px;flex-wrap:wrap}
.mdetail b{font-family:var(--f-data)}

/* Horizontal bars */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hb-top span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-top .num{color:var(--muted);white-space:nowrap}
.hb-track{height:9px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:3px}
.hb-track i{display:block;height:100%;background:var(--pasto);border-radius:5px}
.hb-track.t i{background:var(--trigo)}
.hb-track.c i{background:var(--crit)}

.aging{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-2);margin:6px 0 10px}
.aging i{display:block;height:100%}
.ag-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px}
.ag-list div{display:flex;justify-content:space-between;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.best{display:flex;flex-direction:column;gap:8px}
.best-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.medal{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--trigo-soft);color:var(--trigo)}
.best-row:first-child .medal{background:var(--trigo);color:#1c1405}

/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--head);color:var(--head-ink);font-family:var(--f-data);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:10px;white-space:nowrap;position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:140px;color:var(--muted)}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
.mini-tbl td,.mini-tbl th{padding:7px 8px}
.mini-tbl th{background:transparent;color:var(--muted);border-bottom:1px solid var(--line);position:static}
.mini-tbl tbody tr{cursor:default}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-family:var(--f-data);font-weight:600;font-size:13px;white-space:nowrap}
.p-cobrado{background:var(--ok-bg);color:var(--ok)}
.p-pendiente{background:var(--warn-bg);color:var(--warn)}
.p-vencido{background:var(--crit-bg);color:var(--crit)}
.p-cerrado{background:var(--surface-2);color:var(--muted)}
.tipo{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tipo i{width:8px;height:8px;border-radius:2px;background:var(--pasto)}
.tipo.egreso i{background:var(--cuero)} .tipo.neutro i{background:var(--muted)}
.ej-tag{font-family:var(--f-data);font-size:11px;background:var(--info-bg);color:var(--info);border-radius:4px;padding:1px 5px;margin-left:6px;letter-spacing:.04em}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-width:0}
.filters input{flex:1 1 220px}

/* Mobile cards */
.cards{display:none;flex-direction:column;gap:10px}
.ocard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;border:0;text-align:left;width:100%;display:block}
.oc-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.oc-mid{display:flex;justify-content:space-between;gap:8px;margin-top:6px;align-items:baseline}
.oc-mid .num{font-size:19px;font-weight:700}
.oc-meta{font-size:13px;color:var(--muted);margin-top:4px}
.prog{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ok)}

.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.subtabs button[aria-pressed="true"]{background:var(--pasto);border-color:var(--pasto);color:var(--surface)}
.cob-list{display:flex;flex-direction:column;gap:10px}
.cob{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 14px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.cob .who{font-weight:700;font-size:16px}
.cob .what{font-size:13.5px;color:var(--muted)}
.cob .amt{text-align:right}
.cob .amt .num{font-size:19px;font-weight:700;display:block}
.cob .amt small{color:var(--muted);font-size:12.5px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--ink);margin:0 0 4px;font-size:20px}

/* Bottom nav (mobile) */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.bnav button svg{width:22px;height:22px}
.bnav button[aria-current="true"]{color:var(--pasto)}
.bnav .fab{width:58px;height:58px;border-radius:50%;background:var(--trigo);color:#1c1405;justify-self:center;margin-top:-26px;box-shadow:0 4px 14px rgba(0,0,0,.2);justify-content:center}
.bnav .fab svg{width:28px;height:28px}

/* Sheet / modal */
.ov{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:calc(100% - 20px);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.sh-h{background:var(--head);color:var(--head-ink);padding:14px 16px;display:flex;align-items:center;gap:10px}
.sh-h h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:600;flex:1}
.sh-h .x{background:none;border:0;color:var(--head-ink);font-size:26px;line-height:1;padding:0 4px}
.sh-b{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.sh-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-f .grow{flex:1}
.fs{display:flex;flex-direction:column;gap:6px;min-width:0}
.fs > label,.fs > .lab{font-family:var(--f-data);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fs input,.fs select,.fs textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
.fs textarea{min-height:64px;resize:vertical}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.frow.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{border-color:var(--pasto);background:var(--pasto);color:var(--surface)}
.tchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tchip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;text-align:left;min-width:0}
.tchip b{display:block;font-size:15px}
.tchip small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.tchip[aria-pressed="true"]{border-color:var(--pasto);box-shadow:inset 0 0 0 1.5px var(--pasto);background:var(--pasto-soft)}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.totalbox{background:var(--surface);border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line)}
.totalbox .num{font-size:24px;font-weight:700}
.check{display:flex;gap:10px;align-items:center;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.check input{width:22px;height:22px;accent-color:var(--pasto)}
.hint{font-size:13px;color:var(--muted)}
.confirm{background:var(--crit-bg);border-radius:9px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%}
.confirm span{flex:1;min-width:160px;font-weight:600;color:var(--crit)}
.pagos-l{display:flex;flex-direction:column;gap:6px}
.pago{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px}
.err{color:var(--crit);font-size:13.5px;font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.c-8,.c-4,.c-6,.c-5,.c-7{grid-column:span 12}}
@media (max-width:760px){
  .tabs,.top-right .btn-prim,.hide-m{display:none}
  .top-in{padding:8px 16px}

<script>
(function(){
"use strict";
/* ---------- Dictado: interpreta una frase hablada y la convierte en datos (sin internet, por reglas) ---------- */
const Voz=(function(){
  const N=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[“”"¿?¡!]/g," ");
  const UN={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintiuna:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,
    treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900};
  const MULT={mil:1e3,millon:1e6,millones:1e6,palo:1e6,palos:1e6,luca:1e3,lucas:1e3};
  const TENS=new Set([30,40,50,60,70,80,90]);
  const numTok=t=>{if(/^\d{1,3}(\.\d{3})+$/.test(t))return +t.replace(/\./g,"");if(/^\d+,\d+$/.test(t))return +t.replace(",",".");if(/^\d+(\.\d{1,2})?$/.test(t))return +t;return null};
  /* convierte "cuatro millones quinientos mil" / "4 millones 500 mil" / "treinta y dos" en dígitos */
  function numeros(text){
    const toks=text.replace(/\$/g," ").replace(/([,;:])(?!\d)/g," $1 ").split(/\s+/).filter(Boolean);
    const out=[];let i=0;
    while(i<toks.length){
      const t=toks[i];const nv=numTok(t),wv=UN[t],mv=MULT[t];
      if(nv==null&&wv==null&&mv==null){out.push(t);i++;continue}
      let total=0,cur=0,prev=null,j=i,any=false;
      while(j<toks.length){
        const x=toks[j];const n2=numTok(x),w2=UN[x],m2=MULT[x];
        if(m2!=null){ if(prev==="mult"&&m2<1e6)break; if(m2>=1e6){total+=(cur||1)*m2;cur=0}else{cur=(cur||1)*m2} prev="mult";any=true;j++;
          if(toks[j]==="y"&&toks[j+1]==="medio"&&m2>=1e6){total+=m2/2;j+=2}
          if(toks[j]==="de"&&/^pesos?$/.test(toks[j+1]||""))j++;
          continue}
        if(n2!=null){ if(prev==="num"||prev==="word")break; cur+=n2;prev="num";any=true;j++;continue}
        if(w2!=null){ if(prev==="num")break; if(prev==="word"){const last=cur%1000;if(!((last%100===0&&w2<100)||(TENS.has(last%100)&&w2<10)))break} cur+=w2;prev="word";any=true;j++;continue}
        if(x==="y"&&prev==="word"&&TENS.has(cur%100)&&UN[toks[j+1]]!=null&&UN[toks[j+1]]<10){j++;continue}
        break;
      }
      if(!any){out.push(t);i++;continue}
      out.push(String(total+cur));i=j;
    }
    return out.join(" ").replace(/\s+([,;:])/g,"$1");
  }
  const stemRe=name=>{const w=N(name).split(/\s+/).filter(Boolean).map(x=>x.replace(/(es|s)$/,"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));return new RegExp("\\b"+w.map(x=>x+"(?:es|s)?").join("\\s+(?:de\\s+)?")+"\\b")};

async function sha(txt){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=2166136261;for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,16777619)}return "f"+(h>>>0).toString(16)}
}

/* ---------- Almacenamiento local (IndexedDB, con respaldo en localStorage) ---------- */
const Store=(()=>{let db=null,mode="mem",R={},M={};
  const lsSave=()=>{if(mode!=="ls")return;try{localStorage.setItem("arragen.recs",JSON.stringify(R));localStorage.setItem("arragen.meta",JSON.stringify(M))}catch(e){}};
  const tx=(st,m,f)=>new Promise((res,rej)=>{const t=db.transaction(st,m);const r=f(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  return {
    get mode(){return mode},
    async init(){
      try{if(!window.indexedDB)throw 0;db=await new Promise((res,rej)=>{const r=indexedDB.open("arragen",1);r.onupgradeneeded=()=>{r.result.createObjectStore("recs",{keyPath:"id"});r.result.createObjectStore("meta")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej("blocked")});mode="idb";return}catch(e){}
      try{localStorage.setItem("arragen.t","1");localStorage.removeItem("arragen.t");mode="ls";R=JSON.parse(localStorage.getItem("arragen.recs")||"{}");M=JSON.parse(localStorage.getItem("arragen.meta")||"{}")}catch(e){mode="mem"}
    },
    async all(){return mode==="idb"?await tx("recs","readonly",s=>s.getAll()):Object.values(R)},
    async putMany(arr){if(!arr.length)return;if(mode==="idb")await tx("recs","readwrite",s=>{arr.forEach(r=>s.put(r))});else{arr.forEach(r=>R[r.id]=r);lsSave()}},
    async meta(k){return mode==="idb"?await tx("meta","readonly",s=>s.get(k)):M[k]},
    async setMeta(k,v){if(mode==="idb")await tx("meta","readwrite",s=>s.put(v,k));else{M[k]=v;lsSave()}},
    async clear(){if(mode==="idb"){await tx("recs","readwrite",s=>s.clear());await tx("meta","readwrite",s=>s.clear())}else{R={};M={};lsSave()}}
  }})();

async function putRecs(arr){

  await Store.putMany(arr);await Store.setMeta("pending",[...S.pending]);
}
function mk(c,data,id){const old=id?S.recs.get(id):null;const r=Object.assign({},data,{id:id||newId(),c});
  r.creado=old&&old.creado?old.creado:new Date().toISOString();if(old)r.editado=new Date().toISOString();
  if(!old&&S.session&&S.session.nombre)r.by=S.session.nombre;else if(old&&old.by)r.by=old.by;return r}
async function saveRec(c,data,id){const r=mk(c,data,id);await putRecs([r]);afterWrite();return r}
async function saveMany(list){const rs=list.map(([c,d,id])=>mk(c,d,id));await putRecs(rs);afterWrite();return rs}

/* ---------- Servidor ---------- */
const inGAS=()=>!!(window.google&&google.script&&google.script.run);
function api(req){
  if(inGAS())return new Promise((res,rej)=>google.script.run.withSuccessHandler(s=>{try{res(JSON.parse(s))}catch(e){rej({error:"server"})}}).withFailureHandler(e=>rej({error:"red",msg:String(e&&e.message||e)})).api(JSON.stringify(req)));
  const url=API_URL||S.apiUrl;if(!url)return Promise.reject({error:"sinurl"});
  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),30000);
  return fetch(url,{method:"POST",body:JSON.stringify(req),headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow",signal:ac.signal})
    .then(r=>r.json()).catch(e=>{throw {error:"red",msg:String(e)}}).finally(()=>clearTimeout(t));
}
async function sync(){
  if(S.syncing||!S.session||!S.unlocked)return;
  S.syncing=true;paintSync();
  const push=canW()?[...S.pending].map(id=>S.recs.get(id)).filter(Boolean):[];
  try{
    const r=await api({action:"sync",clave:S.session.clave,since:S.since,push});
    if(!r||!r.ok)throw r||{error:"server"};
    push.forEach(p=>{const cur=S.recs.get(p.id);if(cur&&cur.u===p.u)S.pending.delete(p.id)});
    const upd=[];
    (r.pull||[]).forEach(rec=>{const cur=S.recs.get(rec.id);if(cur&&S.pending.has(rec.id)&&(+cur.u>=+rec.u))return;if(!cur||+rec.u>=+cur.u){S.recs.set(rec.id,rec);upd.push(rec)}});
    await Store.putMany(upd);
    S.since=r.now;S.lastSync=Date.now();S.syncErr=null;
    if(r.role&&r.role!==S.session.role){S.session.role=r.role;await Store.setMeta("session",S.session)}
    await Store.setMeta("pending",[...S.pending]);await Store.setMeta("since",S.since);await Store.setMeta("lastSync",S.lastSync);
    S.syncing=false;
    if(upd.length)safeRender();else paintSync();
  }catch(e){
    S.syncing=false;
    const c=e&&e.error;
    S.syncErr=c==="red"||!navigator.onLine?"Sin señal":c==="clave"?"La clave cambió":c==="bloqueado"?"Demasiados intentos":c==="sinurl"?"Falta la dirección del servidor":"Error del servidor";
    if(c==="clave"){S.unlocked=false;S.session.invalid=true;render();return}
    paintSync();
  }
}

    ${needUrl&&!local?`<input class="lock-in" id="urlIn" type="url" placeholder="Dirección del servidor (…/exec)" value="${esc(S.apiUrl)}" aria-label="Dirección del servidor">`:""}
    ${!local?`<input class="lock-in" id="nomIn" placeholder="Tu nombre (para saber quién cargó)" value="${esc(ses&&ses.nombre||"")}" aria-label="Tu nombre" autocomplete="name">`:""}
    <input class="pin" id="pinIn" type="password" autocomplete="current-password" aria-label="Clave">

    <div class="lock-err" id="pinErr"></div>
    ${local?`<button type="button" class="btn btn-ghost" id="otherKey" style="color:var(--head-muted)">Entrar con otra clave</button>`:""}
  </form>`;
  L0.hidden=false;
  setTimeout(()=>{const i=$("#pinIn");if(i)i.focus()},60);
  if($("#otherKey"))$("#otherKey").onclick=()=>{S.session=Object.assign({},S.session,{invalid:true});showLogin()};
  $("#lockF").onsubmit=async e=>{e.preventDefault();
    const clave=$("#pinIn").value.trim(),err=$("#pinErr"),rem=$("#pinRem").checked;err.textContent="";
    if(!clave){err.textContent="Escribí la clave.";return}
    if(local){
      if(await sha(ses.salt+":"+clave)===ses.hash){ses.recordar=rem;await Store.setMeta("session",ses);try{sessionStorage.setItem("arragen.ok",ses.hash)}catch(x){}unlock()}
      else{err.textContent="Clave incorrecta";$("#pinIn").value=""}

    if($("#urlIn")){S.apiUrl=$("#urlIn").value.trim();await Store.setMeta("apiUrl",S.apiUrl)}
    const b=$("#lockBtn");b.disabled=true;b.textContent="Verificando…";
    try{const r=await api({action:"login",clave});

      const salt=newId();const nombre=($("#nomIn")&&$("#nomIn").value.trim())||(ses&&ses.nombre)||"";

      await Store.setMeta("session",S.session);try{sessionStorage.setItem("arragen.ok",S.session.hash)}catch(x){}
      unlock();
    }catch(x){b.disabled=false;b.textContent="Entrar";const c=x&&x.error;
      err.textContent=c==="clave"?"Clave incorrecta":c==="bloqueado"?"Demasiados intentos fallidos. Esperá 10 minutos.":c==="noconfig"?"El servidor todavía no tiene clave. Falta correr «configurar» en Apps Script.":c==="sinurl"?"Pegá la dirección del servidor.":"No hay conexión con el servidor. Probá cuando tengas señal."}
  };
}

  const ventas=ingAll.filter(o=>/venta|faena/i.test(o.tipo)&&+o.cant>0&&+o.total>0);

function proyeccion(A,Y){
  const m=Array(12).fill(0);if(Y!==Y_HOY)return {m,total:0,metodo:""};
  const cm=+HOY.slice(5,7)-1;const ing=A.filter(o=>o.sentido==="ingreso");if(!ing.length)return {m,total:0,metodo:""};
  const byYM={};ing.forEach(o=>{const k=o.fecha.slice(0,7);byYM[k]=(byYM[k]||0)+(+o.total||0)});
  const Yp=String(+Y-1);const prev=MES.map((_,i)=>byYM[Yp+"-"+pad(i+1)]||0);const hasPrev=prev.some(v=>v>0);
  let ytd=0,pytd=0;for(let i=0;i<cm;i++){ytd+=byYM[Y+"-"+pad(i+1)]||0;pytd+=prev[i]}
  const growth=pytd>0?Math.min(2,Math.max(.5,ytd/pytd)):1;
  let s6=0;const d=parseD(HOY.slice(0,7)+"-01");for(let k=0;k<6;k++){d.setMonth(d.getMonth()-1);s6+=byYM[isoOf(d).slice(0,7)]||0}
  const avg6=s6/6;for(let i=cm+1;i<12;i++)m[i]=hasPrev?prev[i]*growth:avg6;
  return {m,total:m.reduce((a,b)=>a+b,0),metodo:hasPrev?`Mismo mes de ${Yp} ajustado por cómo viene ${Y}`:`Promedio de los últimos 6 meses (${fmtM(avg6)}); mejora con más historia`};
}
function insights(A,yr,Y,tIng,tEgr,act,rec,evY){
  const out=[];
  const recV=rec.filter(e=>e.prox<HOY);
  if(recV.length){const n=sum(recV,evCant);out.push({lvl:"crit",t:`${plural(recV.length,"atención vencida","atenciones vencidas")}`,d:`${plural(n,"animal","animales")} con dosis o tratamiento atrasado. La más vieja: ${esc(recV[0].tipo)}${recV[0].producto?" "+esc(recV[0].producto):""}, vencida el ${fmtD(recV[0].prox)}.`})}
  const r7=rec.filter(e=>e.prox>=HOY&&dias(HOY,e.prox)<=7);
  if(r7.length)out.push({lvl:"warn",t:`${plural(r7.length,"atención programada","atenciones programadas")} esta semana`,d:r7.slice(0,3).map(e=>`${esc(e.tipo)} (${fmtD(e.prox)})`).join(", ")+". Organizá la manga y los productos."});
  const mu=evY.filter(e=>/muerte/i.test(e.tipo));const nMu=sum(mu,evCant);
  if(nMu&&act.length){const t=nMu/(act.length+nMu);out.push({lvl:t>.03?"warn":"info",t:`Mortandad ${Y}: ${pct(t)}`,d:`${plural(nMu,"animal muerto","animales muertos")} sobre ${(act.length+nMu).toLocaleString("es-AR")}. ${t>.03?"Está por encima de un rodeo sano; revisá causas con el veterinario.":""}`})}
  const TP=tactoPV(evY.filter(e=>/tacto|diagn/i.test(e.tipo)&&e.res));
  if(TP.t>=5){const p=TP.p/TP.t;out.push({lvl:p<.8?"warn":"ok",t:`Preñez en tactos: ${pct(p)}`,d:`${TP.p} preñadas y ${TP.v} vacías en ${Y}.${p<.8?" Revisá las vacías antes de la próxima temporada de servicio.":""}`})}
  const ingAll=A.filter(o=>o.sentido==="ingreso");
  const venc=ingAll.filter(o=>o.vencido>0).sort((a,b)=>b.vencido-a.vencido);
  if(venc.length){const t=sum(venc,o=>o.vencido),b=venc[0];out.push({lvl:"crit",t:`${fmtM(t)} vencidos sin cobrar`,d:`${plural(venc.length,"operación","operaciones")}. La mayor: ${esc(b.contra||"sin cliente")} debe ${fmtM(b.vencido)} desde el ${fmtD(b.venc)}.`})}
  const pend=ingAll.filter(o=>o.saldo>0);const tP=sum(pend,o=>o.saldo);
  if(tP>0&&pend.length>1){const [c,v]=topOf(group(pend,o=>o.contra||"Sin cliente",o=>o.saldo));if(v/tP>=.4)out.push({lvl:"warn",t:`${esc(c)} concentra el ${pct(v/tP)} de lo pendiente`,d:`Debe ${fmtM(v)}. Antes de venderle otra vez a plazo, pedí que cancele o una garantía.`})}
  const lastV=ingAll.map(o=>o.fecha).sort().pop();
  if(lastV){const g=dias(lastV,HOY);if(g>45)out.push({lvl:"warn",t:`${g} días sin ventas registradas`,d:`La última fue el ${fmtD(lastV)}. Si hubo operaciones, falta cargarlas.`})}
  const ing=yr.filter(o=>o.sentido==="ingreso");
  if(ing.length&&tIng>0){const [mi,mv]=topOf(group(ing,o=>+o.fecha.slice(5,7)-1,o=>o.total));out.push({lvl:"ok",t:`${cap(MESL[mi])} fue el mes más fuerte de ${Y}`,d:`${fmtM(mv)} facturados, el ${pct(mv/tIng)} del año.`});
    const canjeV=sum(ing,o=>sum(o.formas.filter(f=>/canje/i.test(f.medio)),f=>f.monto));
    if(canjeV>0)out.push({lvl:"info",t:`${pct(canjeV/tIng)} de lo facturado se cobró en canje`,d:`${fmtM(canjeV)} en animales: suma a la facturación pero no a la caja.`})}
  return out.slice(0,8);
}

function parseCaravanas(txt,pre,desde,hasta){
  let list=[];
  if(txt.trim())list=txt.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  else if(desde!==""&&hasta!==""&&+hasta>=+desde&&+hasta-+desde<2000){const w=String(desde).length;for(let n=+desde;n<=+hasta;n++)list.push(pre+String(n).padStart(w,"0"))}
  return list;
}

   <div class="cards">${H.map(e=>`<button class="ocard" data-evid="${esc(e.id)}"><div class="oc-top"><b>${esc(e.tipo)}${e.producto?" · "+esc(e.producto):""}</b><span class="num hint">${fmtD(e.fecha)}</span></div><div class="oc-meta">${evTarget(e)}${e.est?" · "+esc(e.est):""}</div>${e.res||e.resp?`<div class="oc-meta">${esc(e.res||"")}${e.res&&e.resp?" · ":""}${esc(e.resp||"")}</div>`:""}${e.prox?`<div class="oc-meta">Próxima: ${fmtD(e.prox)}${e.proxOk?" (hecha)":""}</div>`:""}</button>`).join("")}</div>`
   :`<div class="empty"><h3>Sin atenciones${q||S.at.tipo?" que coincidan":""}</h3><p>Registrá vacunas, tratamientos, tactos, pesadas o partos.</p></div>`);

async function saveOp(){
  const ov=$("#ovOp");const g=i=>ov.querySelector("#"+i);const err=g("opErr");err.textContent="";
  const fecha=g("f-fecha").value;if(!fecha){err.textContent="Falta la fecha.";return}
  const neutro=F.sentido==="neutro";const total=neutro?0:(+g("f-total").value||0);
  const formas=neutro?[]:F.formas.filter(f=>+f.monto>0).map(f=>({medio:f.medio,monto:+f.monto,venc:f.venc||fecha,det:(f.det||"").trim(),_ya:!!f.ya}));
  const cat=g("f-cat").value.trim(),obs=g("f-obs").value.trim();

   <section class="card wide"><h2>Tipos de operación</h2><p class="sub">Los botones al cargar ventas, compras, servicios, etc. El movimiento define si es ingreso, egreso o sin dinero.</p>

    <div class="cfg-act"><button class="btn btn-sm" data-add="tipos" ${dis}>+ Agregar tipo</button><span style="flex:1"></span><span class="msg" id="msg-tipos"></span><button class="btn btn-sm btn-green" data-save="tipos" ${dis}>Guardar</button></div></section>
   <section class="card wide"><h2>Tipos de atención</h2><p class="sub">Vacunas, tratamientos y manejos. “Días” es cuándo se propone la próxima dosis (0 = no se repite).</p>

    <div class="cfg-act"><button class="btn btn-sm" data-add="tiposAt" ${dis}>+ Agregar tipo</button><span style="flex:1"></span><span class="msg" id="msg-tiposAt"></span><button class="btn btn-sm btn-green" data-save="tiposAt" ${dis}>Guardar</button></div></section>
   ${simple("cats","Animales / categorías","Si cambiás un nombre, se corrige en animales y operaciones ya cargadas.",C.cats,v=>use("animales","cat",v)+use("ops","cat",v))}
   ${simple("ests","Establecimientos","Campos donde se trabaja. Cambiar un nombre lo corrige en todo lo cargado.",C.ests,v=>use("animales","est",v)+use("ops","est",v)+use("eventos","est",v))}
   ${simple("especies","Especies","Bovinos, equinos, ovinos…",C.especies,v=>use("animales","esp",v))}
   ${simple("medios","Medios de pago","Se pueden combinar en una misma operación.",C.medios,null)}

   <section class="card"><h2>Dictado por voz</h2><p class="sub">${SRC?"Este navegador tiene dictado. Según el celu, puede necesitar señal para entender la voz.":"Este navegador no trae dictado propio: usá el micrófono del teclado dentro del cuadro de dictado."} El texto se interpreta en el equipo, así que completar el formulario funciona sin señal.</p>
    <div class="cfg-act">${SRC&&SRC.available?`<button class="btn btn-sm" id="btnVozOff">${vozLocal()?"Dictado sin señal: preparado":"Preparar dictado sin señal"}</button>`:""}<button class="btn btn-sm" data-act="vz" ${dis}>${MIC}Probar dictado</button><span class="msg" id="msg-voz"></span></div></section>
   <section class="card"><h2>Empresa</h2><p class="sub">Nombre que se ve arriba y en la pantalla de clave.</p>
    <div class="lst"><div class="fs"><label for="c-emp">Nombre</label><input id="c-emp" value="${esc(C.empresa||"")}" ${dis}></div><div class="fs"><label for="c-sub">Subtítulo</label><input id="c-sub" value="${esc(C.sub||"")}" ${dis}></div></div>
    <div class="cfg-act"><span style="flex:1"></span><span class="msg" id="msg-emp"></span><button class="btn btn-sm btn-green" data-save="emp" ${dis}>Guardar</button></div></section>
   <section class="card"><h2>Datos de ejemplo</h2><p class="sub">${nEj?`Hay ${plural(nEj,"registro de ejemplo","registros de ejemplo")} para probar.`:"Cargá un set de ejemplo (animales, atenciones y ventas) para ver cómo funciona todo. Se marcan como EJEMPLO y se borran con un botón."}</p>
    <div class="cfg-act" id="ejBox">${nEj?`<button class="btn btn-sm" id="btnEjDel" ${dis}>Borrar ejemplos</button>`:`<button class="btn btn-sm" id="btnEjAdd" ${dis}>Cargar ejemplos</button>`}</div></section>
   <section class="card"><h2>Sesión en este equipo</h2><p class="sub">${S.session?`Entraste${S.session.nombre?" como <b>"+esc(S.session.nombre)+"</b>":""} con la clave ${S.session.role==="admin"?"de carga":"de consulta"}.`:""} La clave se cambia en la planilla de Google (ver instrucciones).</p>

const rowSimple=(v,cnt,dis)=>`<div class="lrow" data-orig="${esc(v)}"><input class="li-n" value="${esc(v)}" aria-label="Nombre" ${dis}><span class="cnt">${cnt?cnt+" en uso":""}</span><button type="button" class="btn btn-sm btn-ghost li-x" ${dis}>Quitar</button></div>`;
const rowTipo=(t,cnt,dis)=>`<div class="lrow t" data-orig="${esc(t.n)}"><input class="li-n" value="${esc(t.n)}" placeholder="Nombre" aria-label="Nombre" ${dis}><select class="li-s" aria-label="Movimiento" ${dis}>${[["ingreso","Ingreso"],["egreso","Egreso"],["neutro","Sin dinero"]].map(([v,l])=>`<option value="${v}" ${t.s===v?"selected":""}>${l}</option>`).join("")}</select><input class="li-d" value="${esc(t.d||"")}" placeholder="Descripción${cnt?" · "+cnt+" en uso":""}" aria-label="Descripción" ${dis}><button type="button" class="btn btn-sm btn-ghost li-x" ${dis}>Quitar</button></div>`;
const rowAt=(t,cnt,dis)=>`<div class="lrow at" data-orig="${esc(t.n)}"><input class="li-n" value="${esc(t.n)}" placeholder="Nombre" aria-label="Nombre" ${dis}><label class="li-dl"><input class="li-days" type="number" inputmode="numeric" min="0" value="${+t.d||0}" aria-label="Días hasta la próxima" ${dis}> días</label><span class="cnt">${cnt?cnt+" en uso":""}</span><button type="button" class="btn btn-sm btn-ghost li-x" ${dis}>Quitar</button></div>`;
async function saveCfg(next){await saveRec("config",{v:next},"cfg-listas")}
async function saveList(key){
  const msg=$("#msg-"+key);msg.textContent="";msg.style.color="";
  const items=[],seen={},ren=[];
  document.querySelectorAll(`#ls-${key} .lrow`).forEach(r=>{const n=r.querySelector(".li-n").value.trim();if(!n||seen[n.toLowerCase()])return;seen[n.toLowerCase()]=1;const o=r.dataset.orig;if(o&&o!==n)ren.push([o,n]);
    items.push(key==="tipos"?{n,s:r.querySelector(".li-s").value,d:r.querySelector(".li-d").value.trim()}:key==="tiposAt"?{n,d:+r.querySelector(".li-days").value||0}:n)});
  if(!items.length){msg.textContent="Dejá al menos uno.";msg.style.color="var(--crit)";return}
  const C=cfg();C[key]=items;
  const FIELDS={tipos:[["ops","tipo"]],tiposAt:[["eventos","tipo"]],cats:[["ops","cat"],["animales","cat"]],ests:[["ops","est"],["animales","est"],["eventos","est"]],especies:[["animales","esp"]],productos:[["eventos","producto"]]}[key]||[];
  const list=[["config",{v:C},"cfg-listas"]];
  ren.forEach(([o,nv])=>FIELDS.forEach(([c,f])=>L(c).filter(r=>r[f]===o).forEach(r=>{const d=Object.assign({},r,{[f]:nv});delete d.id;delete d.c;list.push([c,d,r.id])})));
  await saveMany(list);S.cfgDirty=false;render();
  const m2=$("#msg-"+key);if(m2){m2.textContent=list.length>1?`Guardado · ${plural(list.length-1,"registro corregido","registros corregidos")}`:"Guardado";m2.style.color="var(--ok)"}
}

/* ---------- Bindings de vistas ---------- */
function bindView(){
  const m=$("#main");m.oninput=null;m.onclick=null;
  m.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{S.year=b.dataset.y;S.selM=null;render()});
  m.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.selM=+b.dataset.m;render()});
  m.querySelectorAll("[data-v2]").forEach(b=>b.onclick=()=>{S.at.tab="prox";setView(b.dataset.v2)});
  m.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==="new")chooser();else if(a==="vz")openVoz();else if(a==="an")openAnim();else if(a==="am")openAltaMult();else if(a==="ev")openEv();else openOp()});
  m.querySelectorAll("tr[data-id],.ocard[data-id]").forEach(r=>r.onclick=()=>openOp(r.dataset.id));
  m.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openOp(b.dataset.edit));
  m.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>openPago(b.dataset.pay));
  m.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{S.cobTab=b.dataset.ct;render()});
  m.querySelectorAll("[data-att]").forEach(b=>b.onclick=()=>{S.at.tab=b.dataset.att;render()});
  m.querySelectorAll("[data-evid]").forEach(b=>b.onclick=()=>openEv(b.dataset.evid));
  m.querySelectorAll("[data-rec]").forEach(b=>b.onclick=e=>{e.stopPropagation();if(!canW())return openEv(b.dataset.rec);openEv(null,{from:b.dataset.rec})});
  m.querySelectorAll("[data-recskip]").forEach(b=>b.onclick=async()=>{const r=S.recs.get(b.dataset.recskip);const d=Object.assign({},r,{proxOk:true});delete d.id;delete d.c;await saveRec("eventos",d,r.id);toast("Recordatorio descartado")});
  m.querySelectorAll("[data-hcat]").forEach(b=>b.onclick=()=>{S.h.cat=S.h.cat===b.dataset.hcat?"":b.dataset.hcat;render()});
  m.querySelectorAll("[data-aid]").forEach(r=>r.onclick=e=>{if(e.target.closest("[data-sel]"))return;openAnim(r.dataset.aid)});
  m.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{c.checked?S.sel.add(c.dataset.sel):S.sel.delete(c.dataset.sel);render()});
  m.querySelectorAll("[data-bulk]").forEach(b=>b.onclick=()=>{const k=b.dataset.bulk;
    if(k==="clr"){S.sel.clear();render()}
    else if(k==="all"){m.querySelectorAll("[data-sel]").forEach(c=>S.sel.add(c.dataset.sel));render()}
    else if(k==="ev")openEv(null,{anims:[...S.sel]});else if(k==="mv")openMover()});
  const deb=(id,fn)=>{const el=$("#"+id);if(!el)return;let t;el.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{fn(el.value);const p=el.selectionStart;render();const n=$("#"+id);if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}},250)}};
  deb("fq",v=>S.f.q=v);deb("hq",v=>S.h.q=v);deb("atq",v=>S.at.q=v);
  [["ftipo",v=>S.f.tipo=v],["fcat",v=>S.f.cat=v],["festado",v=>S.f.estado=v],["hesp",v=>S.h.esp=v],["hlote",v=>S.h.lote=v],["hestado",v=>S.h.estado=v],["attipo",v=>S.at.tipo=v]].forEach(([id,fn])=>{const e=$("#"+id);if(e)e.onchange=()=>{fn(e.value);render()}});
  const csv=$("#btnCsv");if(csv)csv.onclick=exportCsv;
  if(S.view==="ajustes"){
    m.oninput=()=>{S.cfgDirty=true};
    m.onclick=e=>{const x=e.target.closest(".li-x");if(x&&!x.disabled){x.closest(".lrow").remove();S.cfgDirty=true}};
    m.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const k=b.dataset.add;const box=$("#ls-"+k);box.insertAdjacentHTML("beforeend",k==="tipos"?rowTipo({n:"",s:"ingreso",d:""},0,""):k==="tiposAt"?rowAt({n:"",d:0},0,""):rowSimple("",0,""));const r=box.lastElementChild;r.dataset.orig="";r.querySelector(".li-n").focus();S.cfgDirty=true});
    m.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const k=b.dataset.save;if(k==="emp"){const C=cfg();C.empresa=$("#c-emp").value.trim()||"ARRAGEN";C.sub=$("#c-sub").value.trim();await saveCfg(C);S.cfgDirty=false;render();toast("Guardado")}else saveList(k)});
    $("#btnSync").onclick=()=>{S.syncErr=null;sync().then(()=>{if(S.view==="ajustes"&&!S.cfgDirty)render()})};
    $("#btnBk").onclick=()=>download(`arragen-respaldo-${HOY}.json`,JSON.stringify([...S.recs.values()]),"application/json");
    const ea=$("#btnEjAdd");if(ea)ea.onclick=async()=>{await saveMany(demoData());toast("Ejemplos cargados")};
    const ed=$("#btnEjDel");if(ed)ed.onclick=()=>{$("#ejBox").innerHTML=`<div class="confirm"><span>¿Borrar todos los registros de ejemplo?</span><button class="btn btn-sm" id="ejNo">No</button><button class="btn btn-sm btn-danger" id="ejYes">Sí, borrar</button></div>`;$("#ejNo").onclick=render;
      $("#ejYes").onclick=async()=>{const rs=[...S.recs.values()].filter(r=>r.ejemplo&&!r.d).map(r=>Object.assign({},r,{d:1}));await putRecs(rs);afterWrite();toast("Ejemplos borrados")}};
    $("#btnLock").onclick=lockNow;
    const bvo=$("#btnVozOff");if(bvo)bvo.onclick=async()=>{const m=$("#msg-voz");m.textContent="Preparando…";m.style.color="";
      try{const o={langs:["es-AR"],processLocally:true};let st=await SRC.available(o);if(st!=="available"&&SRC.install){await SRC.install(o);st=await SRC.available(o)}
        if(st==="available"){try{localStorage.setItem("arragen.vozLocal","1")}catch(e){}m.textContent="Listo: el dictado funciona sin señal en este celu.";m.style.color="var(--ok)"}
        else{m.textContent="Este celu no permite descargar el dictado. Sin señal usá el micrófono del teclado.";m.style.color="var(--warn)"}}
      catch(e){m.textContent="Este celu no permite descargar el dictado. Sin señal usá el micrófono del teclado.";m.style.color="var(--warn)"}};
    $("#btnOut").onclick=()=>{const n=S.pending.size;$("#sesBox").innerHTML=`<div class="confirm"><span>${n?`Hay ${plural(n,"cambio que todavía no se envió","cambios que todavía no se enviaron")}. Si seguís, se pierden.`:"Se borran los datos de este equipo (en la planilla quedan todos)."}</span><button class="btn btn-sm" id="oNo">Cancelar</button><button class="btn btn-sm btn-danger" id="oYes">Borrar y salir</button></div>`;$("#oNo").onclick=render;
      $("#oYes").onclick=async()=>{await Store.clear();try{sessionStorage.clear()}catch(e){}S.recs.clear();S.pending.clear();S.session=null;S.since=0;S.lastSync=0;S.unlocked=false;render()}};
  }
}

/* ---------- Exportar ---------- */
function download(name,data,type){
  try{const b=new Blob([data],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  catch(e){toast("Este navegador no permite descargar. Los datos están en la planilla de Google.")}
}
function exportCsv(){
  const A=all();const cols=["Fecha","Operación","Movimiento","Establecimiento","Animal","Cantidad","Kg","Precio unidad","Total","Contraparte","Forma de pago","Detalle forma de pago","Próximo vencimiento","Cobrado/pagado","Saldo","Vencido","Estado","Observaciones"];
  const q=v=>{v=v==null?"":String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const n=v=>v?String(Math.round(v*100)/100).replace(".",","):"0";const d4=s=>s?fmtD(s).replace(/\/(\d\d)$/,"/20$1"):"";
  const lines=[cols.join(";")].concat(A.map(o=>[d4(o.fecha),o.tipo,o.sentido,o.est,o.cat,o.cant||"",o.kg||"",n(o.precio),n(o.total),o.contra,o.medioL,o.formas.map(f=>`${f.medio} ${fmt$(f.monto)} vence ${d4(f.venc)}${f.det?" ("+f.det+")":""}`).join(" + "),d4(o.venc),n(o.pagado),n(o.saldo),n(o.vencido),estLabel(o),o.obs].map(q).join(";")));
  download(`arragen-operaciones-${HOY}.csv`,"﻿"+lines.join("\r\n"),"text/csv;charset=utf-8");
}

/* ---------- Toast / teclado ---------- */
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2800)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#ovPago").hidden){$("#ovPago").hidden=true;$("#ovPago").innerHTML="";document.body.style.overflow=""}else if(!$("#ovOp").hidden)closeOv()}});

/* ---------- Arranque ---------- */
async function boot(){
  await Store.init();
  (await Store.all()).forEach(r=>S.recs.set(r.id,r));
  S.pending=new Set((await Store.meta("pending"))||[]);S.since=(await Store.meta("since"))||0;S.lastSync=(await Store.meta("lastSync"))||0;
  S.session=(await Store.meta("session"))||null;S.apiUrl=(await Store.meta("apiUrl"))||"";
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(S.session&&!S.session.invalid){let ok=!!S.session.recordar;if(!ok)try{ok=sessionStorage.getItem("arragen.ok")===S.session.hash}catch(e){}S.unlocked=ok}
  render();if(S.unlocked)sync();
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!/googleusercontent|script\.google/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
  if("serviceWorker" in navigator&&location.hostname==="localhost")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
boot();
})();
